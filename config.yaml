ocpbinaries:
  baseURL: https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/
  version:
    - latest-4.17
    - latest-4.18
    - latest-4.19
  ignoredFiles:
    - windows
    - mac
    - arm64
    - aarch64
    - ppc64le
  outputDir: /var/tmp/ocp/
rhcos:
  baseURL: https://mirror.openshift.com/pub/openshift-v4/x86_64/dependencies/rhcos/
  version:
    - 4.17/latest
    - 4.18/latest
    - 4.19/latest
  ignoredFiles:
    - aliyun
    - aws
    - azure
    - azurestack
    - gcp
    - ibmcloud
    - nutanix
    - openstack
    - vmware
  outputDir: /var/tmp/rhcos
